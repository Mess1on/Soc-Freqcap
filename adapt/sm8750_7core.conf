# OPPO Find N5 / 7 核骁龙 8 Elite（SM8750，2×Prime + 5×Performance）
# 机型：PKH110 / PKH120 / CPH2671。芯片代号仍是 SM8750，不能只按 soc 匹配，
# 所以这里加 brand=OPPO + cores=7；8 核的 SM8750 继续走 sm8750.conf。
#
# 默认均衡 62/78、GPU46；省电 46/51、GPU37。
# 7 核版比 8 核少一颗 Performance 核，机身又薄（折叠屏），热预算更低。
# CPU 百分比仍按“向下吸附后不越过目标”取，不是纯算术占比。
# M 簇（5 颗 Performance）封顶不低于 1.7856GHz：8 核时 M 簇还有 6 颗兜底，
# 7 核只剩 5 颗；再压会让调度把任务甩给两颗 L 核，同频 L 核每瓦性能更差，
# 结果又慢又费电。这个下限对动态封顶/智能/温控/电量偏移都生效。
#
# 常态 cpuset 亲和性（所有芯片统一；三档同值，写入时按 present 裁剪）
# 常态 cpuset 亲和性（所有芯片统一；三档同值，写入时按 present 裁剪）
# 常态 cpuset 亲和性（所有芯片统一；三档同值，写入时按 present 裁剪）
#
# 本文件只提供“全新安装”的默认值；升级安装不会改用户配置。
#match brand=OPPO
#match soc=SM8750
#match cores=7

default_cpu_pct_big=62
default_cpu_pct_little=78
default_cpu_floor_m=1785600
default_gpu_pct=46
default_th_high=72
default_th_low=66
default_psi_gain=5
# ── 省电 / 均衡预设（百分比；落档目标见括号）──
# 默认值 = 均衡档。省电档只用于刷视频/社交/出差保电；均衡档是日常默认。
# 省电：big 1958.4 / little 1785.6 MHz / GPU 400 MHz
preset_sav_big=46
preset_sav_little=51
preset_sav_gpu=37
# 均衡：big 2649.6 / little 2745.6 MHz / GPU 500 MHz
preset_bal_big=62
preset_bal_little=78
preset_bal_gpu=46
# 下方旧调校说明若与 preset_sav_*/preset_bal_* 冲突，以 preset_* 为准。

# 前台调速工作点：cl0 = 5 核 Performance 簇，cl1 = 2 核 Prime 簇。
# 比例沿用 8E 的实测工作点；7 核版先按同一频率表跑，等真机再校。
gov_lv1_cl0_hispeed_ratio=744
gov_lv1_cl0_hispeed_load=80
gov_lv1_cl1_hispeed_ratio=803
gov_lv1_cl1_hispeed_load=80
gov_lv2_cl0_hispeed_ratio=763
gov_lv2_cl0_hispeed_load=90
gov_lv2_cl1_hispeed_ratio=716
gov_lv2_cl1_hispeed_load=90

# 常态 cpuset 亲和性（所有芯片统一；三档同值，写入时按 present 裁剪）
cpuset_top_lv0=0-7
cpuset_top_lv1=0-7
cpuset_top_lv2=0-7
cpuset_fg_lv0=0-5
cpuset_fg_lv1=0-5
cpuset_fg_lv2=0-5
cpuset_bg_lv0=0-2
cpuset_bg_lv1=0-2
cpuset_bg_lv2=0-2
cpuset_sysbg_lv0=0-3
cpuset_sysbg_lv1=0-3
cpuset_sysbg_lv2=0-3
cpuset_restricted_lv0=0-5
cpuset_restricted_lv1=0-5
cpuset_restricted_lv2=0-5


# 应用分类三场景（百分比；实际落点由守护吸附到频点）
cat_video_big=40
cat_video_little=45
cat_video_gpu=32
cat_social_big=46
cat_social_little=51
cat_social_gpu=37
cat_reading_big=33
cat_reading_little=39
cat_reading_gpu=28
