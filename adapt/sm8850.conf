# 骁龙 8 Elite Gen 5（SM8850 / SM8850P）
# Prime 4.608GHz（2 核）/ Gold 3.6288GHz（6 核）/ GPU 1.2GHz
# 候选值，发布前需在 8E5 真机上复测：Prime ≈2.95GHz、Gold ≈2.50GHz。
# 8E5 的 Prime 百分比低于 Gold 是这颗芯片的特性，不要按 8E 等比搬。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：常规节点能被自动探测到，不需要 override.conf。
#match soc=SM8850

default_cpu_pct_big=64
default_cpu_pct_little=69
default_gpu_pct=50
default_th_high=75
default_th_low=68
default_psi_gain=10

# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=kgsl
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now
