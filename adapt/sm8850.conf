# 骁龙 8 Elite Gen 5（SM8850 / SM8850P）—— 2 簇
# 4.61 / 3.63 GHz，Adreno 840 1200 MHz。
# Oryon L（超大核，最高频）默认 46%；Oryon M（中核）默认 52%；GPU 42%。
# 8E5 的超大核百分比低于中核是这颗芯片的特性，不要按 8E 等比搬。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：常规节点能被自动探测到，不需要 override.conf。
#match soc=SM8850

default_cpu_pct_big=46
default_cpu_pct_little=52
default_gpu_pct=42
default_th_high=75
default_th_low=68
default_psi_gain=5

# 动态封顶的 cpuset 分区（0/1/2 档 = 性能/均衡/省电）：只写 cpus 掩码，
# 不搬任务、不碰 core_ctl/migt/metis；关闭/交权/插电暂停按原掩码还原。
cpuset_top_lv0=0-7
cpuset_top_lv1=0-7
cpuset_top_lv2=0-7
cpuset_fg_lv0=0-6
cpuset_fg_lv1=0-5
cpuset_fg_lv2=0-5
cpuset_bg_lv0=0-5
cpuset_bg_lv1=0-3
cpuset_bg_lv2=0-2
cpuset_sysbg_lv0=0-5
cpuset_sysbg_lv1=0-3
cpuset_sysbg_lv2=0-2

# 前台调速工作点（gov_[lv1_|lv2_]cl<N>_<节点名>=值）：
# clN 按 policy 号升序：cl0 = 大核簇，cl1 = 超大核簇。
# hispeed_ratio = 千分比（对位 JSON 里 hispeed_freq / 该模式上限）：
#   均衡：cl0 1785600/2496000=715‰，cl1 1977600/2668800=741‰；
#   省电：cl0 1113600/1785600=624‰，cl1 1382400/1977600=699‰。
# 按我们当前档的封顶换算；0 档不额外改调速器，换档/交权/关闭按账本还原。
gov_lv1_cl0_hispeed_ratio=715
gov_lv1_cl0_hispeed_load=80
gov_lv1_cl1_hispeed_ratio=741
gov_lv1_cl1_hispeed_load=80
gov_lv2_cl0_hispeed_ratio=624
gov_lv2_cl0_hispeed_load=90
gov_lv2_cl1_hispeed_ratio=699
gov_lv2_cl1_hispeed_load=90

# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=kgsl
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now
