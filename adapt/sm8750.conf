# 骁龙 8 Elite（SM8750 / SM8750P）—— 2 簇
# Oryon L（cpu6-7，最高频）默认 46%；Oryon M（cpu0-5）默认 51%；GPU 45%。
# 按硬件最高频分档：最高簇 = BIG，最低簇 = LITTLE。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：8E 的常规节点能被自动探测到，不需要 override.conf。
#match soc=SM8750

default_cpu_pct_big=46
default_cpu_pct_little=51
default_gpu_pct=45
default_th_high=75
default_th_low=68
default_psi_gain=5

# 调速器工作点参数（gov_<tier>_<节点名>=值）：随「动态封顶」开关生效，
# 交权/关闭按账本还原。hispeed_freq = 负载冲过 hispeed_load(90) 时直接
# 落到的频点——本机官方默认 0（关闭），压到 1689600 = 突发先落到高效
# 频点、配合升频限速削峰。
# 实测注意：p0（3.53G 簇）的 hispeed 被系统动态管理（观察到 1344000），
# 种它会 5 秒一次拉锯——只种系统不管的簇；其他簇有数据后再加。
# 实验数据，是否长期最优需 A/B；不想动调速器就删掉这一行。
gov_big_hispeed_freq=1689600

# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=kgsl
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now
