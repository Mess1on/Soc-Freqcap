# 骁龙 8 Elite（SM8750 / SM8750P）
# Prime 4.32GHz（2 核）/ Gold 3.5328GHz（6 核）/ GPU 1.2GHz
# 候选值，发布前需在 8E 真机上复测：Prime ≈2850MHz、Gold ≈2400MHz。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：8E 的常规节点能被自动探测到，不需要 override.conf。
#match soc=SM8750

default_cpu_pct_big=66
default_cpu_pct_little=68
default_gpu_pct=50
default_th_high=75
default_th_low=68
default_psi_gain=10

# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=kgsl
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now
