# 骁龙 8 Elite（SM8750 / SM8750P）—— 2 簇
# Oryon L（cpu6-7，最高频）默认均衡 62%；Oryon M（cpu0-5）默认均衡 68%；GPU 46%。省电 46/51/37%。
# 按硬件最高频分档：最高簇 = BIG，最低簇 = LITTLE。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：8E 的常规节点能被自动探测到，不需要 override.conf。
#match soc=SM8750

default_cpu_pct_big=62
default_cpu_pct_little=68
default_gpu_pct=46
default_th_high=75
default_th_low=68
default_psi_gain=5
# ── 省电 / 均衡预设（百分比；落档目标见括号）──
# 默认值 = 均衡档。省电档只用于刷视频/社交/出差保电；均衡档是日常默认。
# 省电：big 1958.4 / little 1785.6 MHz / GPU 400 MHz
preset_sav_big=46
preset_sav_little=51
preset_sav_gpu=37
# 均衡：big 2649.6 / little 2400 MHz / GPU 500 MHz
preset_bal_big=62
preset_bal_little=68
preset_bal_gpu=46
# 下方旧调校说明若与 preset_sav_*/preset_bal_* 冲突，以 preset_* 为准。

# 常态 cpuset 亲和性（所有芯片统一；三档同值，写入时按 present 裁剪）
# top-app 全核；foreground/restricted 不用超大核；system-background/background
# 只留小核簇。关闭/交权/插电暂停按原掩码还原。

# 前台调速工作点（gov_[lv1_|lv2_]cl<N>_<节点名>=值）：
# clN 按 policy 号升序：cl0 = policy0（大核簇），cl1 = policy6（超大核簇）。
# hispeed_ratio = 千分比（对位 JSON 里 hispeed_freq / 该模式上限）：
#   均衡：cl0 1785600/2400000=744‰，cl1 1958400/2438400=803‰；
#   省电：cl0 1363200/1785600=763‰，cl1 1401600/1958400=716‰。
# 按我们当前档的封顶换算，任何封顶下都能落到封顶以下。
# 0 档不额外改调速器；换档/交权/关闭按账本还原。
gov_lv1_cl0_hispeed_ratio=744
gov_lv1_cl0_hispeed_load=80
gov_lv1_cl1_hispeed_ratio=803
gov_lv1_cl1_hispeed_load=80
gov_lv2_cl0_hispeed_ratio=763
gov_lv2_cl0_hispeed_load=90
gov_lv2_cl1_hispeed_ratio=716
gov_lv2_cl1_hispeed_load=90

# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=kgsl
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now

# 常态 cpuset 亲和性（所有芯片统一；三档同值，写入时按 present 裁剪）
cpuset_top_lv0=0-7
cpuset_top_lv1=0-7
cpuset_top_lv2=0-7
cpuset_fg_lv0=0-5
cpuset_fg_lv1=0-5
cpuset_fg_lv2=0-5
cpuset_bg_lv0=0-2
cpuset_bg_lv1=0-2
cpuset_bg_lv2=0-2
cpuset_sysbg_lv0=0-3
cpuset_sysbg_lv1=0-3
cpuset_sysbg_lv2=0-3
cpuset_restricted_lv0=0-5
cpuset_restricted_lv1=0-5
cpuset_restricted_lv2=0-5


# 应用分类三场景（百分比；实际落点由守护吸附到频点）
cat_video_big=40
cat_video_little=45
cat_video_gpu=32
cat_social_big=46
cat_social_little=51
cat_social_gpu=37
cat_reading_big=33
cat_reading_little=39
cat_reading_gpu=28
