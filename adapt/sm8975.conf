# 骁龙 8 Elite Extreme Gen 6（SM8975）—— 3 簇
# 5.01 / 4.03 / 3.74 GHz，Adreno 850 1450 MHz。
# 超大核默认均衡 60%；中核默认均衡 68%；能效核默认均衡 70%；GPU 38%。省电 46/50/55/32%。
# 三簇机型 m=3：中间簇映射到 CPU_PCT_MID，MID2 不生效。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：常规节点能被自动探测到，不需要 override.conf。
#match soc=SM8975

default_cpu_pct_big=60
default_cpu_pct_mid=68
default_cpu_pct_little=70
default_gpu_pct=38
default_th_high=75
default_th_low=68
default_psi_gain=5
# ── 省电 / 均衡预设（百分比；落档目标见括号）──
# 默认值 = 均衡档。省电档只用于刷视频/社交/出差保电；均衡档是日常默认。
# 省电：big 2255 / mid 2015 / little 2048 MHz / GPU 450 MHz
preset_sav_big=46
preset_sav_mid=50
preset_sav_little=55
preset_sav_gpu=32
# 均衡：big 3006 / mid 2740 / little 2617 MHz / GPU 550 MHz
preset_bal_big=60
preset_bal_mid=68
preset_bal_little=70
preset_bal_gpu=38
# 下方旧调校说明若与 preset_sav_*/preset_bal_* 冲突，以 preset_* 为准。

# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=kgsl
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now

# 常态 cpuset 亲和性（所有芯片统一；三档同值，写入时按 present 裁剪）
cpuset_top_lv0=0-7
cpuset_top_lv1=0-7
cpuset_top_lv2=0-7
cpuset_fg_lv0=0-5
cpuset_fg_lv1=0-5
cpuset_fg_lv2=0-5
cpuset_bg_lv0=0-2
cpuset_bg_lv1=0-2
cpuset_bg_lv2=0-2
cpuset_sysbg_lv0=0-3
cpuset_sysbg_lv1=0-3
cpuset_sysbg_lv2=0-3
cpuset_restricted_lv0=0-5
cpuset_restricted_lv1=0-5
cpuset_restricted_lv2=0-5


# 应用分类三场景（百分比；实际落点由守护吸附到频点）
cat_video_big=42
cat_video_mid=45
cat_video_little=49
cat_video_gpu=25
cat_social_big=48
cat_social_mid=50
cat_social_little=54
cat_social_gpu=28
cat_reading_big=36
cat_reading_mid=40
cat_reading_little=43
cat_reading_gpu=21
