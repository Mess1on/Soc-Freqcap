# 骁龙 8 Elite Extreme Gen 6（SM8975）—— 3 簇
# 5.01 / 4.03 / 3.74 GHz，Adreno 850 1450 MHz。
# 超大核（最高簇）默认 40%；中核（中间簇）默认 47%；能效核（最低簇）默认 51%；GPU 41%。
# 三簇机型 m=3：中间簇映射到 CPU_PCT_MID，MID2 不生效。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：常规节点能被自动探测到，不需要 override.conf。
#match soc=SM8975

default_cpu_pct_big=40
default_cpu_pct_mid=47
default_cpu_pct_little=51
default_gpu_pct=41
default_th_high=75
default_th_low=68
default_psi_gain=10

# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=kgsl
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now
