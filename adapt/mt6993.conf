# 天玑 9500（MT6993）—— 3 簇
# 峰值：C1-Ultra 4210 / C1-Premium 3500 / C1-Pro 2700 MHz，G1-Ultra MC12 1716 MHz。
# 日常封顶：Ultra 3000（72%）、Premium 2200（63%）、Pro 1900（71%）、GPU 600（35%）。
# 百分比按"封顶向下吸附到频点后仍能落在目标值上"取：71% 算出 2989，会吸到 3000 以下。
# 4.21GHz 那一档实测破 11W，是四颗里限频收益最大的一颗；这里压到 3.0GHz。
# 三簇机型 m=3：中间簇映射到 CPU_PCT_MID，MID2 不生效。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：MTK 走 gpufreqv2/limit_table 自动探测，不需要 override.conf。
#match soc=MT6993

default_cpu_pct_big=72
default_cpu_pct_mid=63
default_cpu_pct_little=71
default_gpu_pct=35
default_th_high=75
default_th_low=68
default_psi_gain=10

# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=mtk-gpufreqv2
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now
