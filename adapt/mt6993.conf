# 天玑 9500（MT6993）—— 3 簇
# 峰值：C1-Ultra 4210 / C1-Premium 3500 / C1-Pro 2700 MHz，G1-Ultra MC12 1716 MHz。
# 默认均衡：Ultra 2526（60%）、Premium 2380（68%）、Pro 2319（86%）、GPU 550（33%）。省电 1895/1750/1815、GPU 450。
# 百分比按"封顶向下吸附到频点后仍能落在目标值上"取：71% 算出 2989，会吸到 3000 以下。
# 4.21GHz 那一档实测破 11W，是四颗里限频收益最大的一颗；这里压到 3.0GHz。
# 三簇机型 m=3：中间簇映射到 CPU_PCT_MID，MID2 不生效。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：MTK 走 gpufreqv2/limit_table 自动探测，不需要 override.conf。
#match soc=MT6993

default_cpu_pct_big=60
default_cpu_pct_mid=68
default_cpu_pct_little=86
default_gpu_pct=33
default_th_high=75
default_th_low=68
default_psi_gain=5
# ── 省电 / 均衡预设（百分比；落档目标见括号）──
# 默认值 = 均衡档。省电档只用于刷视频/社交/出差保电；均衡档是日常默认。
# 省电：big 1895 / mid 1750 / little 1815 MHz / GPU 450 MHz
preset_sav_big=46
preset_sav_mid=50
preset_sav_little=68
preset_sav_gpu=27
# 均衡：big 2526 / mid 2380 / little 2319 MHz / GPU 550 MHz
preset_bal_big=60
preset_bal_mid=68
preset_bal_little=86
preset_bal_gpu=33
# 下方旧调校说明若与 preset_sav_*/preset_bal_* 冲突，以 preset_* 为准。


# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=mtk-gpufreqv2
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now
