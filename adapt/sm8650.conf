# 骁龙 8 Gen 3（SM8650）—— 4 个频率域，最高/最低两档 + 两个同频中簇
# 峰值：X4 3302 / A720×3 3149 / A720×2 3149 / A520×2 2266 MHz，Adreno 750 903 MHz。
# 日常封顶：X4 2438（74%）、A720 2074（66%）、A520 1536（68%）、GPU 500（56%）。
# 两个 A720 簇峰值相同：模块按硬件最高频去重后只留一档 MID；若内核报了两个
# 不同峰值，MID2 也用同一个 66%。
# 4 簇机型：BIG / MID2 / MID / LITTLE 依次按频率高低映射。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：常规节点能被自动探测到，不需要 override.conf。
#match soc=SM8650

default_cpu_pct_big=74
default_cpu_pct_mid2=66
default_cpu_pct_mid=66
default_cpu_pct_little=68
default_gpu_pct=56
default_th_high=75
default_th_low=68
default_psi_gain=5

# 动态封顶的 cpuset 分区（0/1/2 档 = 性能/均衡/省电）；只写 cpus 掩码。
cpuset_top_lv0=0-7
cpuset_top_lv1=0-7
cpuset_top_lv2=0-7
cpuset_fg_lv0=2-6
cpuset_fg_lv1=2-6
cpuset_fg_lv2=2-6
cpuset_bg_lv0=0-1
cpuset_bg_lv1=0-1
cpuset_bg_lv2=0-1
cpuset_sysbg_lv0=0-1,5-6
cpuset_sysbg_lv1=0-1,5-6
cpuset_sysbg_lv2=0-1,5-6

# 前台调速工作点（clN 按 policy 号升序；0 档不改调速器）。
# 这台有两个同频簇，tier 会去重，因此必须用 clN 写法。
# hispeed_ratio = 千分比：均衡 618/559/505/524‰，省电 660/494/427/432‰。
gov_lv1_cl0_hispeed_ratio=618
gov_lv1_cl0_hispeed_load=80
gov_lv1_cl1_hispeed_ratio=559
gov_lv1_cl1_hispeed_load=80
gov_lv1_cl2_hispeed_ratio=505
gov_lv1_cl2_hispeed_load=80
gov_lv1_cl3_hispeed_ratio=524
gov_lv1_cl3_hispeed_load=80
gov_lv2_cl0_hispeed_ratio=660
gov_lv2_cl0_hispeed_load=85
gov_lv2_cl1_hispeed_ratio=494
gov_lv2_cl1_hispeed_load=85
gov_lv2_cl2_hispeed_ratio=427
gov_lv2_cl2_hispeed_load=85
gov_lv2_cl3_hispeed_ratio=432
gov_lv2_cl3_hispeed_load=85

# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=kgsl
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now
