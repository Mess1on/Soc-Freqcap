# 机型适配表模板。放在这里是为了让目录随包发布，本文件不会装到任何机器上
# （#match 里的机型不存在），作者新增适配时照这个格式另存一个文件即可。
#
# 装机脚本按 #match 认机器：三种键都要命中才算命中，一条 #match 都没有的文件不装。
#   #match brand=OnePlus
#   #match model=PJZ110
#   #match soc=SM8750        soc 比对 ro.soc.model，取不到时退回 ro.board.platform，按包含匹配
#
# 下面是节点表，只认这四种键（其余行不会被带进数据目录）：
#   cpu-dir <这一簇的目录> <硬件最高频>
#   gpu-max <可写的 GPU 上限节点>
#   gpu-min <对应的 GPU 下限节点>
#   gpu-freqs <空格分隔的 GPU 频点表>
#
# 可选：全新安装的芯片默认值（升级安装不会套用，用户改过的值不会被动）。
# 只认这几个键，值必须是数字且在配置合法区间内；打错的行直接忽略：
#   default_cpu_pct_big / default_cpu_pct_little / default_gpu_pct
#   default_th_high / default_th_low / default_psi_gain
# 例：
# default_cpu_pct_big=66
# default_cpu_pct_little=68
# default_th_high=70
#
# 这张表只在守护自动探测一个都拿不到时，节点行才会生效；
# 探测正常的机器只看 default_*（且只在全新安装时）。
# 从用户发来的适配包里取现成的一行：
#   grep '^#ovr ' 收到的包.txt | sed 's/^#ovr //'
#
#match model=__NO_SUCH_MODEL__
# cpu-dir /sys/devices/system/cpu/cpufreq/policy0 3532800
# gpu-max /sys/class/devfreq/3d00000.qcom,kgsl-3d0/max_freq
# gpu-min /sys/class/devfreq/3d00000.qcom,kgsl-3d0/min_freq
# gpu-freqs 1100000000 967000000 443000000 160000000
