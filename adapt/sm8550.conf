# 骁龙 8 Gen 2（SM8550）—— 3 簇
# 峰值：X3 3187 / A715·A710×4 2803 / A510×3 2016 MHz，Adreno 740 680 MHz。
# 默认均衡：X3 2092.8（66%）、A715 2707.2（97%）、A510 1785.6（89%）、GPU 401（59%）。省电 1478.4/2054.4/1555.2、GPU 295~300。
# 百分比按"向下吸附后仍落在目标档"取：1920 写 68% 会算成 1906 并吸到 1805，
# 1459 写 72% 会吸到 1400；所以分别写 69% / 73%。
# Adreno 740 只有 8 档（680/615/550/475/401/348/295/220），401 是最后
# 一个不亏的档；Galaxy 版峰值 720MHz，同一百分比会吸到 475 附近，不再额外改。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：常规节点能被自动探测到，不需要 override.conf。
#match soc=SM8550

default_cpu_pct_big=66
default_cpu_pct_mid=97
default_cpu_pct_little=89
default_gpu_pct=59
default_th_high=75
default_th_low=68
default_psi_gain=5
# ── 省电 / 均衡预设（百分比；落档目标见括号）──
# 默认值 = 均衡档。省电档只用于刷视频/社交/出差保电；均衡档是日常默认。
# 省电：big 1478.4 / mid 2054.4 / little 1555.2 MHz / GPU 300 MHz
preset_sav_big=47
preset_sav_mid=74
preset_sav_little=78
preset_sav_gpu=45
# 均衡：big 2092.8 / mid 2707.2 / little 1785.6 MHz / GPU 400 MHz
preset_bal_big=66
preset_bal_mid=97
preset_bal_little=89
preset_bal_gpu=59
# 下方旧调校说明若与 preset_sav_*/preset_bal_* 冲突，以 preset_* 为准。

# 常态 cpuset 亲和性（所有芯片统一；三档同值，写入时按 present 裁剪）

# 前台调速工作点（clN 按 policy 号升序；0 档不改调速器）。
# hispeed_ratio = 千分比：均衡 667/637/542‰，省电 0/550/573‰。
gov_lv1_cl0_hispeed_ratio=667
gov_lv1_cl0_hispeed_load=88
gov_lv1_cl1_hispeed_ratio=637
gov_lv1_cl1_hispeed_load=88
gov_lv1_cl2_hispeed_ratio=542
gov_lv1_cl2_hispeed_load=88
gov_lv2_cl0_hispeed_ratio=0
gov_lv2_cl0_hispeed_load=90
gov_lv2_cl1_hispeed_ratio=550
gov_lv2_cl1_hispeed_load=90
gov_lv2_cl2_hispeed_ratio=573
gov_lv2_cl2_hispeed_load=90

# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=kgsl
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now

# 常态 cpuset 亲和性（所有芯片统一；三档同值，写入时按 present 裁剪）
cpuset_top_lv0=0-7
cpuset_top_lv1=0-7
cpuset_top_lv2=0-7
cpuset_fg_lv0=0-5
cpuset_fg_lv1=0-5
cpuset_fg_lv2=0-5
cpuset_bg_lv0=0-2
cpuset_bg_lv1=0-2
cpuset_bg_lv2=0-2
cpuset_sysbg_lv0=0-3
cpuset_sysbg_lv1=0-3
cpuset_sysbg_lv2=0-3
cpuset_restricted_lv0=0-5
cpuset_restricted_lv1=0-5
cpuset_restricted_lv2=0-5
