# 骁龙 8 Gen 2（SM8550）—— 3 簇
# 峰值：X3 3187 / A715·A710×4 2803 / A510×3 2016 MHz，Adreno 740 680 MHz。
# 日常封顶：X3 2227（70%）、A715 1920（69%）、A510 1459（73%）、GPU 401（59%）。
# 百分比按"向下吸附后仍落在目标档"取：1920 写 68% 会算成 1906 并吸到 1805，
# 1459 写 72% 会吸到 1400；所以分别写 69% / 73%。
# Adreno 740 只有 8 档（680/615/550/475/401/348/295/220），401 是最后
# 一个不亏的档；Galaxy 版峰值 720MHz，同一百分比会吸到 475 附近，不再额外改。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：常规节点能被自动探测到，不需要 override.conf。
#match soc=SM8550

default_cpu_pct_big=70
default_cpu_pct_mid=69
default_cpu_pct_little=73
default_gpu_pct=59
default_th_high=75
default_th_low=68
default_psi_gain=10

# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=kgsl
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now
