# 骁龙 8+ Gen 1（SM8475）—— 3 簇
# 峰值：X2 3200 / A710×3 2750 / A510×4 2000 MHz，Adreno 730 900 MHz。
# 日常封顶：X2 2208（69%）、A710 1805（66%）、A510 1459（73%）、GPU 421（47%）。
# 2208 / 1805 / 1459 / 421 都是频点表里的真实档，百分比按"向下吸附后仍落在
# 目标档"取；A510 写 72% 会算成 1440 并吸到 1400，所以写 73%。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：常规节点能被自动探测到，不需要 override.conf。
#match soc=SM8475

default_cpu_pct_big=69
default_cpu_pct_mid=66
default_cpu_pct_little=73
default_gpu_pct=47
default_th_high=75
default_th_low=68
default_psi_gain=5

# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=kgsl
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now
