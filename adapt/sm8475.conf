# 骁龙 8+ Gen 1（SM8475）—— 3 簇
# 峰值：X2 3200 / A710×3 2750 / A510×4 2000 MHz，Adreno 730 900 MHz。
# 默认均衡：X2 2467（78%）、A710 2750（100%）、A510 1800（90%）、GPU 450（50%）。省电 1708/2180/1560、GPU 350。
# 2208 / 1805 / 1459 / 421 都是频点表里的真实档，百分比按"向下吸附后仍落在
# 目标档"取；A510 写 72% 会算成 1440 并吸到 1400，所以写 73%。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：常规节点能被自动探测到，不需要 override.conf。
#match soc=SM8475

default_cpu_pct_big=78
default_cpu_pct_mid=100
default_cpu_pct_little=90
default_gpu_pct=50
default_th_high=75
default_th_low=68
default_psi_gain=5
# ── 省电 / 均衡预设（百分比；落档目标见括号）──
# 默认值 = 均衡档。省电档只用于刷视频/社交/出差保电；均衡档是日常默认。
# 省电：big 1708 / mid 2180 / little 1560 MHz / GPU 350 MHz
preset_sav_big=54
preset_sav_mid=80
preset_sav_little=78
preset_sav_gpu=39
# 均衡：big 2467 / mid 2750 / little 1800 MHz / GPU 450 MHz
preset_bal_big=78
preset_bal_mid=100
preset_bal_little=90
preset_bal_gpu=50
# 下方旧调校说明若与 preset_sav_*/preset_bal_* 冲突，以 preset_* 为准。

# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=kgsl
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now

# 常态 cpuset 亲和性（所有芯片统一；三档同值，写入时按 present 裁剪）
cpuset_top_lv0=0-7
cpuset_top_lv1=0-7
cpuset_top_lv2=0-7
cpuset_fg_lv0=0-5
cpuset_fg_lv1=0-5
cpuset_fg_lv2=0-5
cpuset_bg_lv0=0-2
cpuset_bg_lv1=0-2
cpuset_bg_lv2=0-2
cpuset_sysbg_lv0=0-3
cpuset_sysbg_lv1=0-3
cpuset_sysbg_lv2=0-3
cpuset_restricted_lv0=0-5
cpuset_restricted_lv1=0-5
cpuset_restricted_lv2=0-5
