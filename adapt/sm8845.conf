# 骁龙 8 Gen 5（SM8845）—— 2 簇
# 3.8 / 3.32 GHz，Adreno 829 约 1.2 GHz。
# 超大核默认均衡 60%；中核默认均衡 69%；GPU 41%。省电 45/50/33%。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：常规节点能被自动探测到，不需要 override.conf。
#match soc=SM8845

default_cpu_pct_big=60
default_cpu_pct_little=69
default_gpu_pct=41
default_th_high=75
default_th_low=68
default_psi_gain=5
# ── 省电 / 均衡预设（百分比；落档目标见括号）──
# 默认值 = 均衡档。省电档只用于刷视频/社交/出差保电；均衡档是日常默认。
# 省电：big 1710 / little 1660 MHz / GPU 400 MHz
preset_sav_big=45
preset_sav_little=50
preset_sav_gpu=33
# 均衡：big 2280 / little 2258 MHz / GPU 500 MHz
preset_bal_big=60
preset_bal_little=69
preset_bal_gpu=41
# 下方旧调校说明若与 preset_sav_*/preset_bal_* 冲突，以 preset_* 为准。

# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=kgsl
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now

# 常态 cpuset 亲和性（所有芯片统一；三档同值，写入时按 present 裁剪）
cpuset_top_lv0=0-7
cpuset_top_lv1=0-7
cpuset_top_lv2=0-7
cpuset_fg_lv0=0-5
cpuset_fg_lv1=0-5
cpuset_fg_lv2=0-5
cpuset_bg_lv0=0-2
cpuset_bg_lv1=0-2
cpuset_bg_lv2=0-2
cpuset_sysbg_lv0=0-3
cpuset_sysbg_lv1=0-3
cpuset_sysbg_lv2=0-3
cpuset_restricted_lv0=0-5
cpuset_restricted_lv1=0-5
cpuset_restricted_lv2=0-5


# 应用分类三场景（百分比；实际落点由守护吸附到频点）
cat_video_big=43
cat_video_little=46
cat_video_gpu=29
cat_social_big=48
cat_social_little=52
cat_social_gpu=33
cat_reading_big=35
cat_reading_little=40
cat_reading_gpu=25
