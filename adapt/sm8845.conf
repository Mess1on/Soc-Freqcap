# 骁龙 8 Gen 5（SM8845）—— 2 簇
# 3.8 / 3.32 GHz，Adreno 829 约 1.2 GHz。
# 超大核（最高簇）默认 51%；中核（较低簇）默认 53%；GPU 41%。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：常规节点能被自动探测到，不需要 override.conf。
#match soc=SM8845

default_cpu_pct_big=51
default_cpu_pct_little=53
default_gpu_pct=41
default_th_high=75
default_th_low=68
default_psi_gain=10

# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=kgsl
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now
