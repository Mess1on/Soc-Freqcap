# 天玑 9600 Pro（MT6995）—— 3 簇
# 峰值：C2-Ultra 4550×2 / C2-Pro 4350×3 / C2-Pro 3100×3 MHz，G2-Ultra NX 1800 MHz。
# 默认均衡：Ultra 2730（60%）、Pro 4.35G 2958（68%）、Pro 3.1G 2392（78%）、GPU 550（31%）。省电 2048/2175/1872、GPU 450。
# 百分比按"封顶向下吸附到频点后仍能落在目标值上"取：55% 算出 2392、36% 算出 648，都会吸低一档。
# 中核被拉到接近超大核的频率，是最该压的一簇，所以 4.35G 那档只给 55%。
# 三簇机型 m=3：中间簇映射到 CPU_PCT_MID，MID2 不生效。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：MTK 走 gpufreqv2/limit_table 自动探测，不需要 override.conf。
#match soc=MT6995

default_cpu_pct_big=60
default_cpu_pct_mid=68
default_cpu_pct_little=78
default_gpu_pct=31
default_th_high=75
default_th_low=68
default_psi_gain=5
# ── 省电 / 均衡预设（百分比；落档目标见括号）──
# 默认值 = 均衡档。省电档只用于刷视频/社交/出差保电；均衡档是日常默认。
# 省电：big 2048 / mid 2175 / little 1872 MHz / GPU 450 MHz
preset_sav_big=46
preset_sav_mid=50
preset_sav_little=61
preset_sav_gpu=25
# 均衡：big 2730 / mid 2958 / little 2392 MHz / GPU 550 MHz
preset_bal_big=60
preset_bal_mid=68
preset_bal_little=78
preset_bal_gpu=31
# 下方旧调校说明若与 preset_sav_*/preset_bal_* 冲突，以 preset_* 为准。


# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=mtk-gpufreqv2
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now
