# 天玑 9600 Pro（MT6995）—— 3 簇
# 峰值：C2-Ultra 4550×2 / C2-Pro 4350×3 / C2-Pro 3100×3 MHz，G2-Ultra NX 1800 MHz。
# 日常封顶：Ultra 3300（73%）、Pro 4.35G 2400（56%）、Pro 3.1G 2000（65%）、GPU 650（37%）。
# 百分比按"封顶向下吸附到频点后仍能落在目标值上"取：55% 算出 2392、36% 算出 648，都会吸低一档。
# 中核被拉到接近超大核的频率，是最该压的一簇，所以 4.35G 那档只给 55%。
# 三簇机型 m=3：中间簇映射到 CPU_PCT_MID，MID2 不生效。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：MTK 走 gpufreqv2/limit_table 自动探测，不需要 override.conf。
#match soc=MT6995

default_cpu_pct_big=73
default_cpu_pct_mid=56
default_cpu_pct_little=65
default_gpu_pct=37
default_th_high=75
default_th_low=68
default_psi_gain=5

# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=mtk-gpufreqv2
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now
