# 天玑 9300 / 9300+（MT6989）—— 3 簇全大核：1×X4 + 3×X4 + 4×A720
# 峰值：9300 = X4 3250（cpu7 单核）/ X4 2850（cpu4-6 三核）/ A720 2000（cpu0-3 四核）
#       MHz，G720 MC12 1300 MHz；9300+ 只把 X4 单核拉到 3400，其余同 9300。
# 日常封顶：X4 单核 2600（80%）、X4×3 2200、A720 1800、GPU 500。
# 百分比按"封顶向下吸附到频点后仍能落在目标值上"取，不是纯算术占比：
#   MID 77% 算出 2194，会吸到 2200 以下一档；78% 算出 2223，才吸得住 2200。
#   GPU 38% 算出 494，吸不住 500；39% 算出 507，才吸得住 500。
# 9300+ 共用本文件：80% 算出 2720，向下吸附到 2600 附近的频点（取整向下，
# 不越过 2700 附近），与 9400/9400+ 共用 80% 的先例一致。
# A720 簇本身极省（实测 0.641W / 25.11 分），日常 1800 不要再往下压；
# 硬下限参考 1400（智能/省电叠加时别把这一簇压破 1400）。
# 三簇机型 m=3：中间簇映射到 CPU_PCT_MID，MID2 不生效。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：MTK 走 gpufreqv2/limit_table 自动探测，不需要 override.conf。
#match soc=MT6989

default_cpu_pct_big=80
default_cpu_pct_mid=78
default_cpu_pct_little=90
default_gpu_pct=39
default_th_high=75
default_th_low=68
default_psi_gain=5

# 动态封顶的 cpuset 分区（0/1/2 档 = 性能/均衡/省电）；只写 cpus 掩码。
cpuset_top_lv0=0-7
cpuset_top_lv1=0-7
cpuset_top_lv2=0-7
cpuset_fg_lv0=0-6
cpuset_fg_lv1=0-6
cpuset_fg_lv2=0-6
cpuset_bg_lv0=0-3
cpuset_bg_lv1=0-2
cpuset_bg_lv2=0-2
cpuset_sysbg_lv0=0-3
cpuset_sysbg_lv1=0-2
cpuset_sysbg_lv2=0-2

# 前台调速工作点（clN 按 policy 号升序；0 档不改调速器）。
# hispeed_ratio = 千分比：均衡 583/619/583‰，省电 0/600/706‰。
gov_lv1_cl0_hispeed_ratio=583
gov_lv1_cl0_hispeed_load=88
gov_lv1_cl1_hispeed_ratio=619
gov_lv1_cl1_hispeed_load=88
gov_lv1_cl2_hispeed_ratio=583
gov_lv1_cl2_hispeed_load=88
gov_lv2_cl0_hispeed_ratio=0
gov_lv2_cl0_hispeed_load=90
gov_lv2_cl1_hispeed_ratio=600
gov_lv2_cl1_hispeed_load=90
gov_lv2_cl2_hispeed_ratio=706
gov_lv2_cl2_hispeed_load=90
