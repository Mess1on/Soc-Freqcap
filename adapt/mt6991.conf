# 天玑 9400 / 9400+（MT6991）—— 3 簇
# 峰值：X925 3626 / X4 3300 / A720 2400 MHz，Immortalis-G925 MC12 1612 MHz。
# 日常封顶：X925 2900（80%）、X4 2200（67%）、A720 1800（75%）、GPU 550（35%）。
# 百分比按"封顶向下吸附到频点后仍能落在目标值上"取，不是纯算术占比：
# GPU 34% 算出 548，会吸到 550 以下一档；35% 算出 564，才吸得住 550。
# 9400+ 只把 X925 拉到 3730：同一份 80% 会吸附到 2980 左右（取整向下，不越过 3000 附近），
# 所以两档共用一份，不单独再建。
# 三簇机型 m=3：中间簇映射到 CPU_PCT_MID，MID2 不生效。
#
# 本文件只提供"全新安装"的默认值；升级安装不会改用户配置。
# 节点表留空：MTK 走 gpufreqv2/limit_table 自动探测，不需要 override.conf。
#match soc=MT6991

default_cpu_pct_big=80
default_cpu_pct_mid=67
default_cpu_pct_little=75
default_gpu_pct=35
default_th_high=75
default_th_low=68
default_psi_gain=5

# 器件描述（供作者查阅，装机脚本不套用）：
# thermal_filter=cpu,gpu,soc
# gpu_backend=mtk-gpufreqv2
# idle_current_ma=250
# batt_current_path=/sys/class/power_supply/battery/current_now
