# Soc智能限频 · 分应用档位
# 一行一条：  包名=值
#   值 = full      这个应用前台时整个交还系统（CPU 与 GPU 都不封顶）
#   值 = 1~100     CPU 四簇统一按这个百分比封顶（GPU 仍走 socfreq.conf 的 GPU_PCT）
#   值 = 80:40     CPU 80%、GPU 40%；任一段留空表示那一边跟随全局（80: / :40）
#   值 = keep      这个应用在熄屏那一刻是前台时不交还系统（挂机/下载）
#
# 优先级：游戏名单 > 满血窗口（开机 / 熄屏解除）> 本文件 > 全局百分比。
# 本文件盖住 socfreq.conf 里的 CPU_PCT_*，但不盖住熄屏解除。
#
# 改完自动生效（守护按 mtime 热重载），不用重启手机也不用重启守护。
# 建议直接在 WebUI 的「配置 → 分应用档位」里加，那里有校验：
# 越界的数字和坏包名会被拒，手写进这里则整条被忽略。
#
# 默认不写死条目；装机时会把「本机已安装的相机类应用」自动设为 full
# （清单在 scripts/builtin_modes.txt，行尾带 #builtin）。不想要就删掉那一行，
# 升级不会把它塞回来；改成别的值也不会被覆盖。
# 下面是几个常见例子，去掉行首的 # 就生效：
#com.android.camera=full
#com.android.provideo=full
#com.oplus.camera=full
#com.autonavi.minimap=80
#com.tencent.map=80
#com.android.camera=70:40
#com.coloros.gallery3d=:35
#com.termux=keep
