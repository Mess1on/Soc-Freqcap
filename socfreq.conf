# Soc智能限频 · 配置文件
#
# 这份文件安装后会被搬到 **/data/adb/soc_freqcap/socfreq.conf**。
# 模块目录之外是有意为之：管理器升级模块 = 先删模块目录再解包，
# 放在里面会被新包的默认值盖掉，你改的东西一次升级就没用了。
#
# 改完不用重启也不用重启守护：守护按 mtime 巡检，一个周期内自动重算生效。
# 值写错了不会生效——会被夹回合法范围，调速器名只认白名单里的词。
#
# 同目录下还有一份**分应用档位**，盖住这里的 CPU_PCT_*：
#   /data/adb/soc_freqcap/app_modes.conf    包名=full 或 包名=60
#   /data/adb/soc_freqcap/vendors.txt       发行商词典，只给 WebUI 挑候选用

# 常态巡检间隔（秒）。厂商框架把上限顶高时，每隔这么久压回去一次。
# 太小费电，太大容易被厂商调度顶穿。2 ~ 60
INTERVAL=5

# 游戏退出宽限（秒）。游戏退到后台后仍保持解锁的时长，
# 用来吸收切后台/弹窗造成的短暂前台丢失。超过自动复位到常态封顶。
GAME_GRACE_SEC=10

# ── CPU 封顶百分比 ──────────────────────────────────────────────
# 按各 policy 的硬件最高频排序自动分档，再落到下面四个键之一。
# 关键：**不是四个键都生效**。档数 m = 该机不同硬件上限的个数，
# 骁龙 8 Elite 这类 2 超核 + 6 性能核是 m=2，只有 BIG 和 LITTLE 两档，
# MID2 / MID 这两个键在这台机上**调了没有任何作用**。
#   CPU_PCT_BIG     最高频簇（超大核）        m>=1
#   CPU_PCT_MID2    次高档                    仅 m>=4 机型生效
#   CPU_PCT_MID     中间档                    仅 m>=3 机型生效
#   CPU_PCT_LITTLE  最低频簇（小核）          m>=2
# 页面上没落到的档会显示"（未检测到）"，那就是这台机没有这一档。
# 1 ~ 100。封顶值会向下吸附到实际频点，绝不超过设定百分比。
CPU_PCT_BIG=65
CPU_PCT_MID2=64
CPU_PCT_MID=66
CPU_PCT_LITTLE=65

# 调度策略：cap = 按上面的百分比固定封顶；smart = 按负载四档状态机
# （空闲/轻载/中载/重载）动态给目标，上面的 CPU_PCT_* 退化成天花板。
# 游戏、满血、熄屏交还三条路径两种策略完全一样。
STRATEGY=cap

# ── GPU ────────────────────────────────────────────────────────
# GPU 封顶百分比。高通 KGSL 与 MTK Mali 都支持。
# 1 ~ 100
# 温控和 PSI 偏移同样作用在 GPU 上（最热的传感器常常就是 GPU）；
# 充电态的地板不作用于 GPU —— 这里填的就是你明确要的上限。
GPU_PCT=45

# 是否把 GPU 频率下限钉在最低档。
# 1 = 钉住，抵消厂商 boost 抬高下限造成的越界（推荐）
# 0 = 不管下限，只封上限
GPU_MIN_LOCK=1

# ── 熄屏策略 ───────────────────────────────────────────────────
# uncap = 熄屏后解除封顶、把写权限交还系统，只保留轻巡检（新装默认）。
# keep  = 旧行为，熄屏照样封着。
# 升级用户不会自动补 SCREEN_POLICY；没有这一行时按 SCREEN_UNCAP 映射：
# 1 = uncap，0 = keep。这样老用户升级后行为不变。
SCREEN_POLICY=uncap
# 熄屏轻巡检周期（5~300 秒）。熄屏时不再跑 dumpsys/PSI/温控，
# 每轮只读一次亮屏信号。
SOFF_INTERVAL=15
# 亮屏信号文件。留空 = 自动挑：fb0/blank（0=亮）> backlight/brightness（>0=亮）。
# 例如 /sys/class/graphics/fb0/blank 或 /sys/class/backlight/panel0-backlight/brightness
SCREEN_STATE_PATH=
# 旧键兼容：仅在缺少 SCREEN_POLICY 时参与映射。
SCREEN_UNCAP=0

# ── 熄屏深度空闲（P0b）──────────────────────────────────────────
# 熄屏后电流持续低于 IDLE_CURRENT_MA 达 IDLE_HOLD_CYCLE 轮，
# 巡检周期从 SOFF_INTERVAL 拉到 IDLE_INTERVAL（亮屏信号仍每轮读）。
IDLE_CURRENT_MA=250
IDLE_HOLD_CYCLE=2
IDLE_INTERVAL=30
# 电流相对熄屏 EMA 基线突增这么多 mA，只作为"可能亮屏"的提示，
# 再用 dumpsys power 确认；不用绝对阈值。
WAKE_DELTA_MA=150
BATT_CURRENT_PATH=/sys/class/power_supply/battery/current_now
# ua = 微安（AOSP 常见）；ma = 毫安。PJZ110 实测为 ma 且充电为负，
# 代码统一取绝对值。换机型先用 fallback 脚本确认量级。
BATT_CURRENT_UNIT=ma

# ── 开机满血窗口（秒） ─────────────────────────────────────────
# 开机后前这么多秒完全不封顶，让桌面加载、后台恢复、媒体扫描跑快些，
# 到点自动压回常态。0 = 关。上限 600。
# 窗口由 service.sh 在 boot_completed 后写一个截止时间戳，
# 判定和压回都在守护里做——service.sh 跑得太早，那时 sysfs 未必就绪。
BOOT_FULL_S=60

# ── 日常调速器（默认 conservative） ─────────────────────────────
# 默认使用 conservative：频率升降有缓冲，比 schedutil 更稳，也更省电。
# 填写时只在白名单内匹配：conservative / walt / schedutil / powersave / performance
# 厂商调速器（hmbird、scx）永远不会被改写。
# 留空 = 把调速器写回模块改动前的原值（开机快照），不是留在最后写入的那个。
CPU_GOVERNOR=conservative

# ── 实时偏移（PSI 借额度 / 温控降档 / 充电态放宽） ──────────────
# 三条都只改"这一轮生效的封顶"，从不写回上面的百分比：
# 滑杆上是多少就是多少，背后没有第二个东西在改它。
# 生效值 = 上面的设定值（插电时先抬到 CHG_PCT）+ PSI 借出 − 温控压回。

# PSI 护栏。读 /proc/pressure/cpu 的 stall 速率（µs 累计量按墙钟差分），
# 和这台机自己最近 10 分钟的基线比：超出 2 倍且绝对值再高 30ms/s 才算"卡"，
# 一档一档往外借，不卡了一档一档收回来。
# 不用 avg10 的绝对值判：实测一台骁龙 8 Elite 静置就有 4~5 个点，
# 而满载时"有帽"和"没帽"的 stall 率几乎一样（129 vs 129 ms/s）——
# 拿 <1% 收紧 / >5% 放宽那种绝对阈值，几秒内就会把封顶顶到 100% 停在那儿，
# 模块等于自己关掉。收紧由你自己调。
PSI_ADAPT=1
PSI_GAIN=10
PSI_STEP=5
# 判到卡之后额度至少借住这么多秒（避免每档只活一个巡检周期，抖来抖去）
PSI_HOLD=30
# 不卡了每隔这么多秒收回一档
PSI_BACK=15

# 温控闭环。扫 /sys/class/thermal/thermal_zone*/，只取 type 里带
# cpu / gpu / soc 的，拿最热那个读数（vbat、ibat、bcl 那些不是温度，
# 按数值筛会把电压当温度、把恒 0 的当"很凉快"）。
# 超 TH_HIGH 逐档往下压，回到 TH_LOW 以下才逐档还；中间是迟滞带，不动。
# 这是主动闭环，比等内核热管控直接砍频平滑；厂商那边同时在压时
# 日志会写"厂商已压更低"，不会互相盖。
# 觉得温控没效果时先试 TH_HIGH=68~70：8 Elite 这类 SoC 到 75℃ 时内核
# 往往已经开始砍频，主动闭环就晚了。默认保持 75 是因为各机型散热差异大，
# 需要按真机温度曲线调，不替所有人拍板。
TH_CAP=1
TH_HIGH=75
TH_LOW=68
TH_STEP=5
# 最多比设定值再低这么多个百分点（0 = 只保留充电态和 PSI，不主动压）
TH_MAX=25
TH_BACK=20

# 充电态。插着电（battery/status 为 Charging/Full）时把常态封顶至少抬到
# CHG_PCT，拔电自动回落 —— 发热由充电器承担，没必要压着。
# 温控优先于这一条：热的时候插着电照样降。
# 分应用档位不吃这块地板：那是用户对某个应用的明确选择。
# 注意：CHG_UNCAP=1 时插电期间会抬到 CHG_PCT（不是变慢，是让路），
# 因为那时帽不在设定值上，采进来的分布会把建议带偏。关掉这一项就会继续攒。
CHG_UNCAP=1
CHG_PCT=100

# 合计偏移的总闸（百分点）。PSI 和温控各自有上限，叠起来可能过狠：
# 极端配置下 PSI_GAIN=30、TH_MAX=60，65% 会被压到 5%。
# 默认 +15 / -30，0 = 那一侧完全封死。只影响生效值，不改你的设定。
ADAPT_UP_MAX=15
ADAPT_DOWN_MAX=30

# ── 电量阶梯（第四个偏移源）──────────────────────────────────────
# 不充电且容量低于 BATT_LOW 时再收紧 BATT_LOW_CUT 个点；
# 低于 BATT_CRIT 再叠 BATT_CRIT_CUT。两刀都受 ADAPT_DOWN_MAX 总闸约束。
# 分应用档位不吃这刀（和应用专属档不吃充电地板同理）。
# BATT_STEP=0 是出厂默认：低电量时先不额外压，免得用户觉得"没电就更卡"；
# 想要更省电再打开。
BATT_STEP=0
BATT_LOW=20
BATT_LOW_CUT=5
BATT_CRIT=10
BATT_CRIT_CUT=10
